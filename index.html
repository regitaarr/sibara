<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — SIBARA</title>
    <meta name="description" content="Sistem Pengelolaan Barang Milik Negara (BMN) — Login">
    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="login-wrapper">
        <div class="login-card">
            <!-- Logo -->
            <div class="login-logo text-center mb-2">
                <img src="assets/bps.png" alt="Logo BPS" style="height: 60px;">
            </div>
            <h1 class="login-title">SIBARA: Sistem Informasi Barang dan Aset</h1>
            <p class="login-sub">Barang Milik Negara — Pengelolaan Digital</p>

            <!-- Alert -->
            <div id="alert-box" class="alert alert-danger py-2 mb-3 d-none" role="alert"></div>

            <!-- Login Form -->
            <form id="login-form" novalidate>

                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0">
                            <i class="bi bi-envelope text-muted"></i>
                        </span>
                        <input type="email" id="email" class="form-control border-start-0"
                            placeholder="alamat@email.com" autocomplete="email" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0">
                            <i class="bi bi-lock text-muted"></i>
                        </span>
                        <input type="password" id="password" class="form-control border-start-0 border-end-0"
                            placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" id="toggle-pass" class="input-group-text bg-transparent"
                            title="Tampilkan password">
                            <i class="bi bi-eye text-muted" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btn-login" class="btn-bmn-primary mt-1">
                    <span class="btn-text"><i class="bi bi-box-arrow-in-right"></i> Masuk</span>
                    <span class="spinner d-none" id="spin-login"></span>
                </button>
            </form>

            <!-- Forgot Password -->
            <div class="text-center mt-3">
                <button type="button" class="btn btn-link btn-sm text-muted p-0" id="btn-forgot">
                    Lupa password?
                </button>
            </div>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal modal-bmn fade" id="modal-forgot" tabindex="-1" aria-labelledby="modal-forgot-label"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered mx-3">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-forgot-label">
                        <i class="bi bi-key me-2"></i>Reset Password
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="fs-sm text-muted mb-3">Masukkan email Anda. Link reset password akan dikirim ke inbox
                        Anda.</p>
                    <div id="forgot-alert" class="alert py-2 d-none mb-3"></div>
                    <label class="form-label" for="reset-email">Email</label>
                    <input type="email" id="reset-email" class="form-control" placeholder="alamat@email.com">
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Batal</button>
                    <button type="button" id="btn-send-reset" class="btn btn-primary btn-sm px-4">
                        Kirim Link
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import { loginUser, sendResetEmail, getUserRole } from "./js/auth.js";
        import { auth } from "./js/firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // Redirect already-logged-in users
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const role = await getUserRole(user.email);
                    window.location.href = "dashboard.html";
                } catch (_) { }
            }
        });

        // ─── Toggle password visibility ──────────────────────────────
        document.getElementById("toggle-pass").addEventListener("click", () => {
            const inp = document.getElementById("password");
            const icon = document.getElementById("eye-icon");
            const isHidden = inp.type === "password";
            inp.type = isHidden ? "text" : "password";
            icon.className = isHidden ? "bi bi-eye-slash text-muted" : "bi bi-eye text-muted";
        });

        // ─── Login form ───────────────────────────────────────────────
        const loginForm = document.getElementById("login-form");
        const alertBox = document.getElementById("alert-box");
        const btnLogin = document.getElementById("btn-login");
        const spinLogin = document.getElementById("spin-login");

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            alertBox.classList.add("d-none");
            btnLogin.disabled = true;
            if (spinLogin) spinLogin.classList.remove("d-none");
            btnLogin.querySelector(".btn-text").classList.add("d-none");

            try {
                const user = await loginUser(email, password);
                // Wait for role resolution before routing
                await getUserRole(user.email);
                window.location.href = "dashboard.html";
            } catch (err) {
                let msg = "Login gagal. Periksa email dan password.";
                if (err.code === "auth/user-not-found" || err.code === "auth/wrong-password"
                    || err.code === "auth/invalid-credential") {
                    msg = "Email atau password salah.";
                } else if (err.code === "auth/too-many-requests") {
                    msg = "Terlalu banyak percobaan. Coba beberapa saat lagi.";
                } else if (err.message) {
                    msg = err.message;
                }
                alertBox.textContent = msg;
                alertBox.classList.remove("d-none");
            } finally {
                btnLogin.disabled = false;
                if (spinLogin) spinLogin.classList.add("d-none");
                btnLogin.querySelector(".btn-text").classList.remove("d-none");
            }
        });

        // ─── Forgot password modal ─────────────────────────────────
        const modalForgot = new bootstrap.Modal(document.getElementById("modal-forgot"));
        document.getElementById("btn-forgot").addEventListener("click", () => {
            document.getElementById("forgot-alert").classList.add("d-none");
            document.getElementById("reset-email").value = document.getElementById("email").value;
            modalForgot.show();
        });

        document.getElementById("btn-send-reset").addEventListener("click", async () => {
            const email = document.getElementById("reset-email").value.trim();
            const forgotAlert = document.getElementById("forgot-alert");
            forgotAlert.classList.add("d-none");

            if (!email) {
                forgotAlert.textContent = "Masukkan email terlebih dahulu.";
                forgotAlert.className = "alert alert-warning py-2 mb-3";
                forgotAlert.classList.remove("d-none");
                return;
            }
            try {
                await sendResetEmail(email);
                forgotAlert.textContent = "Link reset password telah dikirim. Periksa inbox Anda, jika tidak ada cek di Spam.";
                forgotAlert.className = "alert alert-success py-2 mb-3";
                forgotAlert.classList.remove("d-none");
            } catch (err) {
                forgotAlert.textContent = "Gagal mengirim email. Pastikan email terdaftar.";
                forgotAlert.className = "alert alert-danger py-2 mb-3";
                forgotAlert.classList.remove("d-none");
            }
        });
    </script>

</body>

</html>
