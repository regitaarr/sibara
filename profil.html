<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIBARA | Profil</title>
    <link rel="icon" type="image/png" href="assets/bps.png">
    <meta name="description" content="Profil Pengguna Sistem BMN">
    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- ─── Topbar ─────────────────────────────────────────────── -->
    <header class="topbar">
        <div class="brand">
            <img src="assets/bps.png" alt="BPS" style="height: 24px; margin-right: 8px;"> Profil
        </div>
    </header>

    <!-- ─── Page Content ────────────────────────────────────────── -->
    <main class="page-content">

        <div class="card-bmn">
            <div class="section-header">
                <h6><i class="bi bi-person-lines-fill me-1"></i>Informasi Akun</h6>
            </div>

            <div id="profil-alert" class="alert d-none mb-3 py-2"></div>

            <form id="form-profil">
                <div class="mb-3">
                    <label class="form-label text-muted fs-sm" for="profil-email">Email Terdaftar</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
                        <input type="email" id="profil-email" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="profil-nama">Nama Lengkap</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" id="profil-nama" class="form-control" placeholder="Nama ..." required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="profil-password">Password Baru (opsional)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" id="profil-password" class="form-control border-end-0"
                            placeholder="Biarkan kosong jika tidak diubah" autocomplete="new-password">
                        <button type="button" id="toggle-pw" class="input-group-text bg-transparent"
                            title="Tampilkan password">
                            <i class="bi bi-eye text-muted" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="row gx-2 mt-4">
                    <div class="col-6">
                        <button type="submit" id="btn-save"
                            class="btn-bmn-primary w-100 py-2 fw-bold align-items-center justify-content-center d-flex"
                            style="min-height: 44px; border: none;">
                            <span class="btn-text">Simpan</span>
                            <span class="spinner d-none" id="spin-save"></span>
                        </button>
                    </div>
                    <div class="col-6">
                        <button type="button" id="btn-logout"
                            class="btn btn-danger text-white w-100 py-2 fw-bold align-items-center justify-content-center d-flex"
                            style="min-height: 44px; border: none;">
                            Keluar
                        </button>
                    </div>
                </div>
            </form>
        </div>

    </main>

    <!-- ─── Logout Confirmation Modal ────────────────────────────── -->
    <div class="modal modal-bmn fade" id="modal-logout" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered mx-3" style="max-width: 400px; margin: auto;">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-body text-center p-4">
                    <div class="mb-3">
                        <i class="bi bi-box-arrow-right text-danger" style="font-size: 3rem;"></i>
                    </div>
                    <h5 class="fw-bold mb-2">Konfirmasi Keluar</h5>
                    <p class="text-muted fs-sm mb-4">Apakah Anda yakin ingin keluar dari aplikasi?</p>
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="button" class="btn btn-dark text-white fw-bold px-4 py-2" data-bs-dismiss="modal">
                            Batal
                        </button>
                        <button type="button" class="btn btn-primary fw-bold px-4 py-2" id="btn-confirm-logout"
                            style="background-color: var(--primary); border-color: var(--primary);">
                            Oke
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ─── Bottom Nav ──────────────────────────────────────────── -->
    <nav class="bottom-nav">
        <a href="dashboard.html">
            <i class="bi bi-upc-scan"></i>Input
        </a>
        <a href="rekap.html">
            <i class="bi bi-bar-chart-line"></i>Rekap
        </a>
        <a href="users.html" id="nav-users" class="d-none" data-admin-only>
            <i class="bi bi-people"></i>Pengguna
        </a>
        <a href="profil.html" class="active">
            <i class="bi bi-person"></i>Profil
        </a>
    </nav>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Core App Logic -->
    <script type="module" src="./js/profil.js?v=3"></script>

</body>

</html>
