<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIBARA|Manajemen Pengguna</title>
    <link rel="icon" type="image/png" href="assets/bps.png">
    <meta name="description" content="Admin: kelola akun pengguna Sistem BMN">
    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Toast -->
    <div class="toast-container" id="toast-container"></div>

    <!-- ─── Topbar ─────────────────────────────────────────────── -->
    <header class="topbar">
        <div class="brand">
            <img src="assets/bps.png" alt="BPS" style="height: 24px; margin-right: 8px;"> Manajemen Pengguna
        </div>
    </header>

    <!-- ─── Page Content ────────────────────────────────────────── -->
    <main class="page-content">

        <main class="page-content">

            <!-- ─── Daftar Pengguna ─────────────────────────────────── -->
            <div class="card-bmn">
                <div class="section-header">
                    <h6><i class="bi bi-people me-1"></i>Daftar Pengguna</h6>
                    <button class="btn-bmn-secondary px-2 py-1" id="btn-refresh" title="Refresh">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>
                </div>
                <div id="users-list">
                    <div class="empty-state">
                        <i class="bi bi-hourglass"></i>
                        <p>Memuat data pengguna...</p>
                    </div>
                </div>
            </div>

        </main>

        <!-- ─── Bottom Nav ──────────────────────────────────────────── -->
        <nav class="bottom-nav">
            <a href="dashboard.html">
                <i class="bi bi-upc-scan"></i>Input
            </a>
            <a href="rekap.html">
                <i class="bi bi-bar-chart-line"></i>Rekap
            </a>
            <a href="users.html" class="active">
                <i class="bi bi-people"></i>Pengguna
            </a>
            <a href="profil.html">
                <i class="bi bi-person"></i>Profil
            </a>
        </nav>

        <!-- ─── Edit Role Modal ─────────────────────────────────────── -->
        <div class="modal modal-bmn fade" id="modal-role" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered mx-3">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title"><i class="bi bi-pencil me-2"></i>Edit Role</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p class="fs-sm text-muted mb-1">Akun: <strong id="modal-email"></strong></p>
                        <p class="fs-sm text-muted mb-3">Nama: <strong id="modal-nama"></strong></p>
                        <label class="form-label">Role</label>
                        <select id="modal-role-select" class="form-select">
                            <option value="user">User — Lihat, tambah, edit, download Excel</option>
                            <option value="admin">Admin — Akses penuh (hapus data &amp; kelola pengguna)</option>
                        </select>
                    </div>
                    <div class="modal-footer border-0 pt-0">
                        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Batal</button>
                        <button class="btn btn-primary btn-sm px-4" id="btn-save-role">
                            <i class="bi bi-check2 me-1"></i>Simpan
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ─── Reset Password Modal ────────────────────────────────── -->
        <div class="modal modal-bmn fade" id="modal-reset-pw" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered mx-3">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title"><i class="bi bi-key me-2"></i>Reset Password</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p class="fs-sm text-muted mb-3">
                            Kirim link reset password ke email <strong id="modal-reset-email"></strong>?
                        </p>
                        <p class="fs-sm text-muted">
                            Pengguna akan menerima email berisi link untuk membuat password baru.
                        </p>
                    </div>
                    <div class="modal-footer border-0 pt-0">
                        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Batal</button>
                        <button class="btn btn-warning btn-sm px-4" id="btn-confirm-reset">
                            <i class="bi bi-send me-1"></i>Kirim Email Reset
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <script type="module">
            import { requireAuth, logoutUser, sendResetEmail } from "./js/auth.js";
            import { db } from "./js/firebase-config.js";
            import { loadUsers, addUserRecord, updateUserRole, toggleUserStatus, deleteUserRecord } from "./js/users.js";

            // Firebase Auth imports for secondary app creation
            import { initializeApp, getApps, deleteApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
            import {
                getAuth,
                createUserWithEmailAndPassword,
                signOut as secondarySignOut
            } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

            // ─── Toast helper ─────────────────────────────────────────────
            function showToast(msg, type = "success") {
                const el = document.createElement("div");
                el.className = `toast-bmn ${type}`;
                el.innerHTML = `<i class="bi bi-${type === "success" ? "check-circle" : type === "error" ? "x-circle" : "exclamation-triangle"} me-2"></i>${msg}`;
                document.getElementById("toast-container").appendChild(el);
                setTimeout(() => el.remove(), 5000);
            }

            // ─── Auth guard (admin only) ──────────────────────────────
            try {
                await requireAuth("admin");
            } catch (_) { }

            // (Logout moved to Profil page)
            // ─── Load & render users ──────────────────────────────────
            async function renderUsers() {
                const container = document.getElementById("users-list");
                container.innerHTML = `<div class="empty-state"><i class="bi bi-hourglass"></i><p>Memuat...</p></div>`;
                try {
                    const users = await loadUsers();
                    if (!users.length) {
                        container.innerHTML = `<div class="empty-state"><i class="bi bi-inbox"></i><p>Belum ada pengguna.</p></div>`;
                        return;
                    }
                    container.innerHTML = users.map(u => `
        <div class="d-flex align-items-start justify-content-between py-2 border-bottom gap-2">
          <div class="flex-grow-1 overflow-hidden">
            <div class="fw-600 text-truncate">${u.nama || "—"}</div>
            <div class="fs-sm text-muted text-truncate">${u.id}</div>
            <div class="mt-1 d-flex gap-1 flex-wrap">
              <span class="pill badge-${u.role || "user"}">${u.role === "admin" ? "👑 Admin" : "👤 User"}</span>
              <span class="pill badge-${u.status === false ? "nonaktif" : "aktif"}">
                ${u.status === false ? "⛔ Nonaktif" : "✅ Aktif"}
              </span>
            </div>
          </div>
          <div class="d-flex gap-1 flex-shrink-0 flex-wrap justify-content-end" style="max-width:130px">
            <button class="btn btn-sm btn-outline-primary py-0 px-2"
                    onclick="openRoleModal('${u.id}','${(u.nama || '').replace(/'/g, "\\'")}','${u.role || 'user'}')"
                    title="Edit role">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-outline-secondary py-0 px-2"
                    onclick="openResetModal('${u.id}')"
                    title="Reset password">
              <i class="bi bi-key"></i>
            </button>
            <button class="btn btn-sm ${u.status === false ? "btn-outline-success" : "btn-outline-warning"} py-0 px-2"
                    onclick="handleToggleStatus('${u.id}', ${u.status !== false})"
                    title="${u.status === false ? "Aktifkan" : "Nonaktifkan"}">
              <i class="bi bi-${u.status === false ? "person-check" : "person-x"}"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger py-0 px-2"
                    onclick="handleDeleteUser('${u.id}','${(u.nama || '').replace(/'/g, "\\'")}' )"
                    title="Hapus pengguna">
              <i class="bi bi-trash3"></i>
            </button>
          </div>
        </div>
      `).join("");
                } catch (err) {
                    container.innerHTML = `<div class="empty-state text-danger"><i class="bi bi-x-circle"></i><p>${err.message}</p></div>`;
                }
            }

            renderUsers();
            document.getElementById("btn-refresh").addEventListener("click", renderUsers);

            // ─── Edit role modal ──────────────────────────────────────
            let editingEmail = null;
            const modalRole = new bootstrap.Modal(document.getElementById("modal-role"));

            window.openRoleModal = function (email, nama, currentRole) {
                editingEmail = email;
                document.getElementById("modal-email").textContent = email;
                document.getElementById("modal-nama").textContent = nama;
                document.getElementById("modal-role-select").value = currentRole;
                modalRole.show();
            };

            document.getElementById("btn-save-role").addEventListener("click", async () => {
                const newRole = document.getElementById("modal-role-select").value;
                try {
                    await updateUserRole(editingEmail, newRole);
                    modalRole.hide();
                    showToast("Role berhasil diperbarui!");
                    renderUsers();
                } catch (err) {
                    showToast("Gagal memperbarui role: " + err.message, "error");
                }
            });

            // ─── Reset password modal ────────────────────────────────
            let resetTargetEmail = null;
            const modalResetPw = new bootstrap.Modal(document.getElementById("modal-reset-pw"));

            window.openResetModal = function (email) {
                resetTargetEmail = email;
                document.getElementById("modal-reset-email").textContent = email;
                modalResetPw.show();
            };

            document.getElementById("btn-confirm-reset").addEventListener("click", async () => {
                try {
                    await sendResetEmail(resetTargetEmail);
                    modalResetPw.hide();
                    showToast(`Email reset password telah dikirim ke ${resetTargetEmail}.`);
                } catch (err) {
                    showToast("Gagal mengirim email reset: " + err.message, "error");
                }
            });

            // ─── Toggle status ────────────────────────────────────────
            window.handleToggleStatus = async function (email, currentStatus) {
                const label = currentStatus ? "nonaktifkan" : "aktifkan";
                if (!confirm(`${label.charAt(0).toUpperCase() + label.slice(1)} akun ${email}?`)) return;
                try {
                    await toggleUserStatus(email, currentStatus);
                    showToast(`Akun berhasil di${label}kan!`);
                    renderUsers();
                } catch (err) {
                    showToast("Gagal mengubah status: " + err.message, "error");
                }
            };

            // ─── Delete user ─────────────────────────────────────────
            window.handleDeleteUser = async function (email, nama) {
                if (!confirm(`Hapus pengguna "${nama}" (${email}) secara permanen?\n\nCatatan: akun Firebase Authentication tidak ikut terhapus — hapus manual di Firebase Console jika diperlukan.`)) return;
                try {
                    await deleteUserRecord(email);
                    showToast(`Pengguna "${nama}" berhasil dihapus.`);
                    renderUsers();
                } catch (err) {
                    showToast("Gagal menghapus pengguna: " + err.message, "error");
                }
            };
        </script>

</body>

</html>
